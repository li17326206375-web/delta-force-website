<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赶紧上号-三角洲</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#080b0a;color:#f2f1e9}
.bg{position:fixed;inset:0;background:linear-gradient(135deg,rgba(5,8,7,.97),rgba(14,18,15,.82)),repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 4px)}
.grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(170,180,140,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(170,180,140,.08) 1px,transparent 1px);background-size:55px 55px;transform:perspective(600px) rotateX(58deg) scale(1.4);transform-origin:center bottom;opacity:.35}
.scan{position:absolute;left:0;right:0;height:2px;top:-5px;background:rgba(202,213,149,.45);box-shadow:0 0 18px rgba(202,213,149,.6);animation:scan 5s linear infinite}
@keyframes scan{to{top:105%}}
.wrap{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:30px}
.card{width:min(900px,94vw);padding:72px 50px 64px;text-align:center;border:1px solid rgba(210,218,173,.28);background:rgba(12,16,14,.72);box-shadow:0 25px 80px rgba(0,0,0,.55),inset 0 0 50px rgba(180,190,140,.035);backdrop-filter:blur(8px);position:relative}
.card:before,.card:after{content:"";position:absolute;width:22px;height:22px;border-color:#c5cf8c;border-style:solid;opacity:.75}
.card:before{left:-1px;top:-1px;border-width:2px 0 0 2px}.card:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
.tag{font-size:13px;letter-spacing:5px;color:#aeb79b;margin-bottom:26px}
h1{margin:0;font-size:clamp(42px,8vw,86px);line-height:1.05;letter-spacing:6px;font-weight:900;color:#eeeeda;text-shadow:0 0 25px rgba(205,213,158,.12)}
h1 span{color:#c5cf8c}.sub{margin:25px 0 38px;color:#9ea79a;font-size:15px;letter-spacing:3px}
.btn{display:inline-block;padding:15px 42px;border:1px solid #aeb87c;color:#dfe5bf;text-decoration:none;letter-spacing:3px;background:rgba(165,178,104,.08);transition:.25s}
.btn:hover{background:#aeb87c;color:#11150f;box-shadow:0 0 30px rgba(174,184,124,.25)}
.corner{position:absolute;top:18px;right:20px;font-size:11px;color:#687164;letter-spacing:2px}
.bottom{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#51594f;font-size:11px;letter-spacing:2px}
@media(max-width:600px){.card{padding:55px 22px}h1{letter-spacing:2px}}
</style>
</head>
<body><div class="bg"></div><div class="grid"></div><div class="scan"></div>
<div class="wrap"><main class="card"><div class="corner">D.O. // ONLINE</div><div class="tag">DELTA FORCE · READY</div><h1>赶紧上号<span>-三角洲</span></h1><div class="sub">装备检查完毕 · 等你上线</div><a class="btn" href="#" onclick="alert('赶紧上号！');return false;">立即上号</a></main></div>
<div class="bottom">SYSTEM READY // 赶紧上号</div></body></html>
